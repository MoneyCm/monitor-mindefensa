name: Monitor MinDefensa V2 Professional

on:
  schedule:
    - cron: "17 12 * * *"      # Revision ligera diaria, 07:17 America/Bogota
  workflow_dispatch:           # Ejecución manual
    inputs:
      force_download:
        description: 'Forzar descarga de todos los archivos'
        required: false
        default: 'false'
        type: boolean
      notify:
        description: 'Enviar correo si la ejecucion manual procesa novedades'
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: monitor-mindefensa
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          pip install -r requirements.txt

      - name: Restaurar cache de Excel
        uses: actions/cache/restore@v4
        with:
          path: mindefensa_xlsx
          key: mindefensa-xlsx-${{ hashFiles('mindefensa_state.json') }}
          restore-keys: |
            mindefensa-xlsx-

      - name: Ejecutar Pipeline Monitor
        id: monitor_run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          SISC_TOKEN: ${{ secrets.SISC_TOKEN }}
          SISC_API_URL: ${{ secrets.SISC_API_URL }}
          FORCE_DOWNLOAD: ${{ github.event.inputs.force_download || 'false' }}
          SEND_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.notify == true }}
        run: python main_monitor.py

      - name: Registrar revision sin cambios
        if: success() && steps.monitor_run.outputs.hay_cambios != 'true'
        run: echo "Sin cambios remotos; no se descargaron archivos ni se envio correo."

      - name: Commit State Update
        if: success() && steps.monitor_run.outputs.hay_cambios == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f mindefensa_state.json resumen_actual.json
          git commit -m "chore: update monitor state [skip ci]" || echo "No changes to commit"
          git push

      - name: Guardar cache de Excel actualizado
        if: success() && steps.monitor_run.outputs.hay_cambios == 'true'
        uses: actions/cache/save@v4
        with:
          path: mindefensa_xlsx
          key: mindefensa-xlsx-${{ hashFiles('mindefensa_state.json') }}

      - name: Reportar estado al Centro de fuentes SISC
        if: always()
        continue-on-error: true
        env:
          SISC_API_URL: "https://sisc-backend.onrender.com/api"
          SISC_MONITOR_OUTCOME: ${{ job.status }}
          DATA_CHANGED: ${{ steps.monitor_run.outputs.hay_cambios }}
        run: python sisc_heartbeat.py

      - name: Alerta de Fallo
        if: failure()
        run: |
          echo "::error::El monitor ha fallado. Revisar logs de la ejecución."
